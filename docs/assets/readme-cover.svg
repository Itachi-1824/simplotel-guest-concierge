  <text x="64" y="65" fill="#947d53" font-family="Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="4">SIMPLOTEL · GUEST EXPERIENCE</text>
  <text x="59" y="151" fill="#234d42" font-family="Georgia,serif" font-size="68">Every stay starts</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Simplotel Guest Concierge</title>
  <desc id="desc">Grounded hotel answers. A considered stay. Ask, plan, and review.</desc>
  <defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#e7eddf"/></linearGradient></defs>

  <text x="64" y="278" fill="#607761" font-family="Arial,sans-serif" font-size="18">Grounded answers. Thoughtful planning. You make the final call.</text>
  <g transform="translate(968 133)" fill="none" stroke="#9b8259" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h23v18H7l-7 6zM5 6h13M5 11h9"/><path d="M66 2h24v23H66zM66 8h24M72-3v9M84-3v9M71 14h4M81 14h4M71 20h4"/><circle cx="139" cy="12" r="16"/><path d="m132 12 5 5 9-10"/></g>
  <text x="1050" y="210" fill="#234d42" font-family="Georgia,serif" font-size="28" text-anchor="middle">Ask. Plan. Review.</text>
  <text x="1050" y="244" fill="#738269" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">YOUR STAY, CONSIDERED</text>
  <text x="64" y="376" fill="#64775d" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">ASTRO + REACT</text>

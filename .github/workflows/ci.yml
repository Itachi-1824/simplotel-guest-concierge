name: Verify application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eval
      - run: npm run build
      - name: Verify HTTP API
        run: |
          npm start > /tmp/concierge.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:4321/api/health && break
            sleep 1
          done
          npm run test:api
